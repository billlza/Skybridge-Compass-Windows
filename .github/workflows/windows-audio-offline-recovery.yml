name: Windows Audio Offline Recovery Experiment

on:
  push:
    paths:
      - windows/Skybridge.AudioOfflineRecoveryProbe/**
      - .github/workflows/windows-audio-offline-recovery.yml
      - windows/Skybridge.WinClient/Services/SessionPersistenceContracts.cs
      - windows/Skybridge.WinClient/Services/SessionStore.cs
      - windows/Skybridge.WinClient/Services/ISupabaseAuthClient.cs
      - windows/Skybridge.WinClient.ContractTests/SessionFileCommitTests.cs
      - windows/Skybridge.WinClient.ContractTests/ProcessTerminationBarrier.cs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-continuity:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Pin GitHub remote to SSH
        shell: pwsh
        run: |
          git remote set-url origin git@github.com:billlza/Skybridge-Compass-Windows.git
          git remote set-url --push origin git@github.com:billlza/Skybridge-Compass-Windows.git
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Build and run isolated native experiment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts/audio-offline-continuity -Force | Out-Null
          dotnet build windows/Skybridge.AudioOfflineRecoveryProbe/AudioOfflineRecoveryProbe.csproj -c Release 2>&1 |
            Tee-Object -FilePath artifacts/audio-offline-continuity/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Native experiment build failed.' }
          dotnet run --project windows/Skybridge.AudioOfflineRecoveryProbe/AudioOfflineRecoveryProbe.csproj -c Release --no-build --no-restore -- --lease-study artifacts/audio-offline-continuity/lease 2>&1 |
            Tee-Object -FilePath artifacts/audio-offline-continuity/lease-run.log
          if ($LASTEXITCODE -ne 0) { throw 'Native product lease termination study failed; no mutation retry was allowed.' }
          dotnet run --project windows/Skybridge.AudioOfflineRecoveryProbe/AudioOfflineRecoveryProbe.csproj -c Release --no-build --no-restore -- --run artifacts/audio-offline-continuity/native 2>&1 |
            Tee-Object -FilePath artifacts/audio-offline-continuity/run.log
          if ($LASTEXITCODE -ne 0) { throw 'Native continuity experiment failed.' }
          dotnet run --project windows/Skybridge.AudioOfflineRecoveryProbe/AudioOfflineRecoveryProbe.csproj -c Release --no-build --no-restore -- --observe-rename-sharing artifacts/audio-offline-continuity/sharing 2>&1 |
            Tee-Object -FilePath artifacts/audio-offline-continuity/sharing-run.log
          if ($LASTEXITCODE -ne 0) { throw 'Native rename-sharing observation failed.' }
          dotnet run --project windows/Skybridge.AudioOfflineRecoveryProbe/AudioOfflineRecoveryProbe.csproj -c Release --no-build --no-restore -- --commit-run artifacts/audio-offline-continuity/commit 2>&1 |
            Tee-Object -FilePath artifacts/audio-offline-continuity/commit-run.log
          if ($LASTEXITCODE -ne 0) { throw 'Native protected commit experiment failed.' }
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-audio-offline-continuity-${{ github.sha }}
          path: artifacts/audio-offline-continuity
          if-no-files-found: error
