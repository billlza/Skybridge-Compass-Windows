name: Windows FLAC playback diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flac-playback:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Prepare pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain setup failed.' }
      - name: Build actual product contract executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $project = 'windows/Skybridge.WinClient.ContractTests/Skybridge.WinClient.ContractTests.csproj'
          dotnet restore $project 2>&1 | Tee-Object artifacts/flac-contracts-restore.log
          if ($LASTEXITCODE -ne 0) { throw 'Contract restore failed.' }
          dotnet build $project --configuration Debug --no-restore /p:TreatWarningsAsErrors=true 2>&1 | Tee-Object artifacts/flac-contracts-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Contract build failed.' }
      - name: Validate FLAC playback and shared audio fixtures
        shell: pwsh
        run: |
          $results = @()
          $project = 'windows/Skybridge.WinClient.ContractTests/Skybridge.WinClient.ContractTests.csproj'
          foreach ($attempt in 1..3) {
            dotnet run --project $project --configuration Debug --no-build --no-restore -- --audio-flac-product 2>&1 | Tee-Object "artifacts/flac-timeout-$attempt.log"
            $results += @{ selector = 'audio-flac-product'; attempt = $attempt; exitCode = $LASTEXITCODE }
          }
          foreach ($selector in @('audio-capture-receive', 'audio-file-product', 'audio-original-file', 'audio-product-reception')) {
            dotnet run --project $project --configuration Debug --no-build --no-restore -- "--$selector" 2>&1 | Tee-Object "artifacts/flac-fixture-$selector.log"
            $results += @{ selector = $selector; attempt = 1; exitCode = $LASTEXITCODE }
          }
          $results | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/flac-timeout-results.json
          if ($results.Where({ $_.exitCode -ne 0 }).Count -gt 0) { throw 'A FLAC product contract failed; inspect the primary failure and progress.' }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-flac-playback-${{ github.sha }}
          path: |
            artifacts/flac-*.log
            artifacts/flac-*.json
          if-no-files-found: error
          retention-days: 14
