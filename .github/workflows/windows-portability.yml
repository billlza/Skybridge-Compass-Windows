name: Windows Portability

on:
  push:
    branches:
      - main
      - Bill/windows-portability
  pull_request:
    branches:
      - main
      - Bill/windows-portability
  workflow_dispatch:
    inputs:
      assemble_release_client:
        description: Build and exercise the unpackaged Windows x64 release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-portability:
    name: Windows native client, contracts, stack, and Rust CLI coverage
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Fetch mac UI parity baseline
        shell: pwsh
        run: |
          $baselineCommit = '23ba06343bbaa58c30ef6b9bbddd09bb4e80241c'
          git fetch --no-tags --depth=1 https://github.com/billlza/Skybridge-Compass.git $baselineCommit
          git cat-file -e "$baselineCommit^{commit}"
          git cat-file -e "$baselineCommit`:Sources/SkyBridgeCompassApp/Dashboard/Navigation/NavigationItem.swift"
          git cat-file -e "$baselineCommit`:Sources/SkyBridgeCompassApp/Dashboard/Sections/DashboardContentView.swift"
          git cat-file -e "$baselineCommit`:Sources/SkyBridgeCompassApp/Dashboard/Sections/QuickActionsPanelView.swift"
          git cat-file -e "$baselineCommit`:Sources/SkyBridgeCompassApp/Dashboard/TopBar/TopNavigationBarView.swift"

      - name: Pin GitHub remote to SSH
        shell: pwsh
        run: |
          git remote set-url origin git@github.com:billlza/Skybridge-Compass-Windows.git
          git remote set-url --push origin git@github.com:billlza/Skybridge-Compass-Windows.git

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Install Rust coverage tooling
        id: rust-tooling
        shell: pwsh
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy --component llvm-tools-preview --component rustfmt
          rustup default 1.100.0
          cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Build native WinUI client
        id: native-client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          dotnet restore windows/Skybridge.WinClient/Skybridge.WinClient.csproj 2>&1 | Tee-Object artifacts/native-client-restore.log
          if ($LASTEXITCODE -ne 0) { throw "Native WinUI restore failed: $LASTEXITCODE" }
          dotnet build windows/Skybridge.WinClient/Skybridge.WinClient.csproj --configuration Debug --no-restore /p:TreatWarningsAsErrors=true 2>&1 | Tee-Object artifacts/native-client-build.log
          if ($LASTEXITCODE -ne 0) { throw "Native WinUI build failed: $LASTEXITCODE" }
          $output = 'windows/Skybridge.WinClient/bin/Debug/net10.0-windows10.0.22621.0/win-x64'
          $files = @('Skybridge.WinClient.exe', 'Skybridge.WinClient.dll', 'Skybridge.WinClient.pri', 'skybridge_core.dll', 'skybridge_flac.dll')
          $hashes = @($files | ForEach-Object {
            $path = Join-Path $output $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing native product output: $path" }
            @{ name = $_; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          @{ schemaVersion = 1; commit = $env:GITHUB_SHA; configuration = 'Debug'; runtimeIdentifier = 'win-x64'; build = 'passed'; interactiveLaunch = 'not-run'; deviceAudioPlayback = 'not-run'; files = $hashes } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 artifacts/native-client-build.json

      - name: Run product contracts on Windows
        if: ${{ !cancelled() && steps.native-client.outcome == 'success' }}
        shell: pwsh
        run: |
          $project = 'windows/Skybridge.WinClient.ContractTests/Skybridge.WinClient.ContractTests.csproj'
          dotnet restore $project 2>&1 | Tee-Object artifacts/native-contracts-restore.log
          if ($LASTEXITCODE -ne 0) { throw "Native contracts restore failed: $LASTEXITCODE" }
          dotnet build $project --configuration Debug --no-restore /p:TreatWarningsAsErrors=true 2>&1 | Tee-Object artifacts/native-contracts-build.log
          if ($LASTEXITCODE -ne 0) { throw "Native contracts build failed: $LASTEXITCODE" }
          dotnet run --project $project --configuration Debug --no-build --no-restore 2>&1 | Tee-Object artifacts/native-contracts-run.log
          if ($LASTEXITCODE -ne 0) { throw "Native contracts failed: $LASTEXITCODE" }

      - name: Run Windows portability gate
        if: ${{ !cancelled() && steps.rust-tooling.outcome == 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          .\Scripts\verify-windows-portability-smoke.ps1 -CiMode -CheckOnlineStackFreshness -IncludeRustCliCoverage -StackFreshnessEvidencePath artifacts\windows-stack-freshness.json -RustCliCoverageEvidencePath artifacts\rust-cli-coverage.json -AcceptanceEvidencePath artifacts\windows-portability-acceptance.json
          .\Scripts\verify-windows-portability-acceptance-evidence.ps1 -AcceptanceEvidencePath artifacts\windows-portability-acceptance.json -StackFreshnessEvidencePath artifacts\windows-stack-freshness.json -RustCliCoverageEvidencePath artifacts\rust-cli-coverage.json -RequireRustCliCoverage -RequireOnlineStackFreshness

      - name: Collect native compiler configuration
        if: always()
        shell: pwsh
        run: |
          $nativeBuild = 'windows/Skybridge.WinClient/obj/skybridge-flac/x64'
          if (Test-Path -LiteralPath $nativeBuild -PathType Container) {
            New-Item -ItemType Directory -Force -Path artifacts | Out-Null
            Get-ChildItem -LiteralPath $nativeBuild -Recurse -File -Filter '*.vcxproj' |
              Where-Object { $_.BaseName -in @('FLAC', 'skybridge_flac', 'test_libFLAC') } |
              ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path artifacts $_.Name) }
          }

      - name: Preserve Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-validation-${{ github.sha }}
          path: |
            artifacts/*.log
            artifacts/*.json
            artifacts/*.vcxproj
          if-no-files-found: error
          retention-days: 14

  release-client:
    if: github.event_name == 'workflow_dispatch' && inputs.assemble_release_client
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Assemble and verify Release client
        shell: pwsh
        run: |
          $project = 'windows/Skybridge.WinClient/Skybridge.WinClient.csproj'
          $contracts = 'windows/Skybridge.WinClient.ContractTests/Skybridge.WinClient.ContractTests.csproj'
          dotnet build $project -c Release /p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'Release client build failed' }
          dotnet build $contracts -c Release /p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'Release contracts build failed' }
          $bundle = 'windows/Skybridge.WinClient/bin/Release/net10.0-windows10.0.22621.0/win-x64'
          $contractAssembly = dotnet msbuild $contracts -nologo -property:Configuration=Release -getProperty:TargetPath
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $contractAssembly -PathType Leaf)) {
            throw 'Could not resolve the built Release contract runner'
          }
          $core = Join-Path $bundle 'skybridge_core.dll'
          $contractCore = Join-Path (Split-Path -Parent $contractAssembly) 'skybridge_core.dll'
          Copy-Item -LiteralPath $core -Destination $contractCore -Force
          $coreHash = (Get-FileHash -LiteralPath $core -Algorithm SHA256).Hash
          if ($coreHash -ne (Get-FileHash -LiteralPath $contractCore -Algorithm SHA256).Hash) {
            throw 'The contracts must exercise the native library from the application'
          }
          Write-Output "Packaged native core SHA256: $coreHash"
          dotnet $contractAssembly --native-qperiapt
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Q-Periapt runtime validation failed' }
          $client = Start-Process -FilePath (Join-Path $bundle 'Skybridge.WinClient.exe') -WorkingDirectory $bundle -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            do {
              Start-Sleep -Milliseconds 500
              $client.Refresh()
              if ($client.HasExited) { throw "Release client exited during startup: $($client.ExitCode)" }
            } until ($client.MainWindowHandle -ne [IntPtr]::Zero -or [DateTime]::UtcNow -ge $deadline)
            if ($client.MainWindowHandle -eq [IntPtr]::Zero) { throw 'Release client did not open a window' }
            Write-Host "Release window ready: $($client.MainWindowTitle)"
          } finally {
            if (!$client.HasExited) { $client.Kill(); $client.WaitForExit() }
            $client.Dispose()
          }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: skybridge-windows-x64-qperiapt-0.2.0
          path: windows/Skybridge.WinClient/bin/Release/net10.0-windows10.0.22621.0/win-x64/
          if-no-files-found: error
          retention-days: 14
