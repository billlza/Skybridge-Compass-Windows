name: Windows signature host diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signature-host:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Compare inherited and engine-specific module resolution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          @'
          param([string]$Mode)
          $ErrorActionPreference = 'Stop'
          [Console]::WriteLine("Mode: $Mode; engine: $($PSVersionTable.PSVersion); PSHOME: $PSHOME")
          [Console]::WriteLine("PSModulePath: $env:PSModulePath")
          try {
            foreach ($module in (Get-Module -ListAvailable Microsoft.PowerShell.Security)) {
              [Console]::WriteLine("Candidate: $($module.Version) $($module.Path)")
            }
            if ($Mode -eq 'BuiltIn') {
              Import-Module (Join-Path $PSHOME 'Modules/Microsoft.PowerShell.Security/Microsoft.PowerShell.Security.psd1') -ErrorAction Stop
            }
            $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path $PSHOME 'powershell.exe')
            [Console]::WriteLine("Signature status: $($signature.Status)")
            if ($signature.Status -ne 'Valid') { throw 'The engine binary did not have a valid signature.' }
            $hash = Get-FileHash -LiteralPath (Join-Path $PSHOME 'powershell.exe') -Algorithm SHA256
            [Console]::WriteLine("Engine SHA256: $($hash.Hash)")
            exit 0
          } catch {
            [Console]::Error.WriteLine($_.Exception.ToString())
            [Console]::Error.WriteLine($_.ToString())
            exit 1
          }
          '@ | Set-Content -Encoding utf8 artifacts/signature-host.ps1
          @'
          <Project>
            <Target Name="Probe">
              <Exec Condition="'$(ProbeMode)'!='Isolated'" Command="powershell.exe -NoProfile -NonInteractive -File &quot;$(MSBuildThisFileDirectory)signature-host.ps1&quot; -Mode $(ProbeMode)" />
              <Exec Condition="'$(ProbeMode)'=='Isolated'" EnvironmentVariables="PSModulePath=$(SystemRoot)\System32\WindowsPowerShell\v1.0\Modules" Command="powershell.exe -NoProfile -NonInteractive -File &quot;$(MSBuildThisFileDirectory)signature-host.ps1&quot; -Mode $(ProbeMode)" />
            </Target>
          </Project>
          '@ | Set-Content -Encoding utf8 artifacts/signature-host.proj
          $results = @()
          foreach ($mode in @('Auto', 'BuiltIn', 'Isolated')) {
            dotnet msbuild artifacts/signature-host.proj /nologo /t:Probe "/p:ProbeMode=$mode" 2>&1 | Tee-Object "artifacts/signature-host-$mode.log"
            $results += @{ mode = $mode; exitCode = $LASTEXITCODE }
          }
          $results | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/signature-host-results.json
          if ($results.Where({ $_.exitCode -ne 0 }).Count -gt 0) { throw 'At least one signature-host probe failed; inspect each original result.' }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-signature-host-${{ github.sha }}
          path: artifacts/signature-host*
          if-no-files-found: error
          retention-days: 14
