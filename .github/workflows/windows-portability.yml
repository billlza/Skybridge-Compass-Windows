name: Windows Portability

on:
  push:
    branches:
      - main
      - Bill/windows-portability
  pull_request:
    branches:
      - main
      - Bill/windows-portability
  workflow_dispatch:
    inputs:
      run_ui_smoke:
        description: Verify actual WinUI launch and UI Automation on this runner
        type: boolean
        default: false
      package_native_client:
        description: Preserve the complete Debug client for device qualification
        type: boolean
        default: false
      diagnose_flac:
        description: Record two additional serial FLAC receive runs after the complete contract suite
        type: boolean
        default: false
      diagnose_audio_host:
        description: Record up to twenty serial audio receive-host runs after the complete contract suite
        type: boolean
        default: false
      diagnose_session_storage:
        description: Record up to twenty serial protected account-storage runs after the complete contract suite
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-portability:
    name: Windows native client, contracts, stack, and Rust CLI coverage
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Fetch mac UI parity baseline
        shell: pwsh
        run: |
          $baselineCommit = '23ba06343bbaa58c30ef6b9bbddd09bb4e80241c'
          git fetch --no-tags --depth=1 https://github.com/billlza/Skybridge-Compass.git $baselineCommit
          git cat-file -e "$baselineCommit^{commit}"
          git cat-file -e "$baselineCommit`:Sources/SkyBridgeCompassApp/Dashboard/Navigation/NavigationItem.swift"
          git cat-file -e "$baselineCommit`:Sources/SkyBridgeCompassApp/Dashboard/Sections/DashboardContentView.swift"
          git cat-file -e "$baselineCommit`:Sources/SkyBridgeCompassApp/Dashboard/Sections/QuickActionsPanelView.swift"
          git cat-file -e "$baselineCommit`:Sources/SkyBridgeCompassApp/Dashboard/TopBar/TopNavigationBarView.swift"

      - name: Pin GitHub remote to SSH
        shell: pwsh
        run: |
          git remote set-url origin git@github.com:billlza/Skybridge-Compass-Windows.git
          git remote set-url --push origin git@github.com:billlza/Skybridge-Compass-Windows.git

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Install Rust coverage tooling
        id: rust-tooling
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component llvm-tools-preview --component rustfmt
          rustup default 1.97.1
          cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Build native WinUI client
        id: native-client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          dotnet restore windows/Skybridge.WinClient/Skybridge.WinClient.csproj 2>&1 | Tee-Object artifacts/native-client-restore.log
          if ($LASTEXITCODE -ne 0) { throw "Native WinUI restore failed: $LASTEXITCODE" }
          dotnet build windows/Skybridge.WinClient/Skybridge.WinClient.csproj --configuration Debug --no-restore /p:TreatWarningsAsErrors=true 2>&1 | Tee-Object artifacts/native-client-build.log
          if ($LASTEXITCODE -ne 0) { throw "Native WinUI build failed: $LASTEXITCODE" }
          $output = 'windows/Skybridge.WinClient/bin/Debug/net10.0-windows10.0.22621.0/win-x64'
          $files = @('Skybridge.WinClient.exe', 'Skybridge.WinClient.dll', 'Skybridge.WinClient.pri', 'skybridge_core.dll', 'skybridge_flac.dll')
          $hashes = @($files | ForEach-Object {
            $path = Join-Path $output $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing native product output: $path" }
            @{ name = $_; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          $outputRoot = (Resolve-Path -LiteralPath $output).Path
          $entries = @(Get-ChildItem -LiteralPath $outputRoot -Force -Recurse)
          if ($entries | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }) {
            throw 'Native client output contains a reparse point.'
          }
          $bundleFiles = @($entries | Where-Object { -not $_.PSIsContainer } | Sort-Object FullName | ForEach-Object {
            @{ name = [IO.Path]::GetRelativePath($outputRoot, $_.FullName).Replace('\', '/'); bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          @{ schemaVersion = 2; commit = $env:GITHUB_SHA; configuration = 'Debug'; runtimeIdentifier = 'win-x64'; build = 'passed'; interactiveLaunch = 'not-run'; deviceAudioPlayback = 'not-run'; files = $hashes; bundleFiles = $bundleFiles } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 artifacts/native-client-build.json

      - name: Run product contracts on Windows
        id: product-contracts
        if: ${{ !cancelled() && steps.native-client.outcome == 'success' }}
        shell: pwsh
        env:
          DIAGNOSE_FLAC: ${{ inputs.diagnose_flac }}
          DIAGNOSE_AUDIO_HOST: ${{ inputs.diagnose_audio_host }}
          DIAGNOSE_SESSION_STORAGE: ${{ inputs.diagnose_session_storage }}
        run: |
          $project = 'windows/Skybridge.WinClient.ContractTests/Skybridge.WinClient.ContractTests.csproj'
          dotnet restore $project 2>&1 | Tee-Object artifacts/native-contracts-restore.log
          if ($LASTEXITCODE -ne 0) { throw "Native contracts restore failed: $LASTEXITCODE" }
          dotnet build $project --configuration Debug --no-restore /p:TreatWarningsAsErrors=true 2>&1 | Tee-Object artifacts/native-contracts-build.log
          if ($LASTEXITCODE -ne 0) { throw "Native contracts build failed: $LASTEXITCODE" }
          dotnet run --project $project --configuration Debug --no-build --no-restore 2>&1 | Tee-Object artifacts/native-contracts-run.log
          $contractExit = $LASTEXITCODE
          $diagnosticFailures = @()
          if ($env:DIAGNOSE_FLAC -eq 'true') {
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              dotnet run --project $project --configuration Debug --no-build --no-restore -- --audio-flac-product 2>&1 | Tee-Object "artifacts/native-flac-replay-$attempt.log"
              if ($LASTEXITCODE -ne 0) { $diagnosticFailures += @{ attempt = $attempt; exitCode = $LASTEXITCODE } }
            }
            @{ fullSuiteExitCode = $contractExit; additionalRuns = 2; failedAdditionalRuns = @($diagnosticFailures) } |
              ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 artifacts/native-flac-replay.json
          }
          $audioHostRuns = @()
          if ($env:DIAGNOSE_AUDIO_HOST -eq 'true') {
            for ($attempt = 1; $attempt -le 20; $attempt++) {
              dotnet run --project $project --configuration Debug --no-build --no-restore -- --audio-product-reception 2>&1 | Tee-Object "artifacts/native-audio-host-$attempt.log"
              $hostExit = $LASTEXITCODE
              $audioHostRuns += @{ attempt = $attempt; exitCode = $hostExit }
              if ($hostExit -ne 0) { break }
            }
            @{ fullSuiteExitCode = $contractExit; additionalRuns = @($audioHostRuns) } |
              ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 artifacts/native-audio-host-replay.json
          }
          $audioHostFailures = @($audioHostRuns | Where-Object { $_.exitCode -ne 0 })
          $sessionStorageRuns = @()
          if ($env:DIAGNOSE_SESSION_STORAGE -eq 'true') {
            for ($attempt = 1; $attempt -le 20; $attempt++) {
              dotnet run --project $project --configuration Debug --no-build --no-restore -- --session-storage 2>&1 | Tee-Object "artifacts/native-session-storage-$attempt.log"
              $storageExit = $LASTEXITCODE
              $sessionStorageRuns += @{ attempt = $attempt; exitCode = $storageExit }
              if ($storageExit -ne 0) { break }
            }
            @{ fullSuiteExitCode = $contractExit; additionalRuns = @($sessionStorageRuns) } |
              ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 artifacts/native-session-storage-replay.json
          }
          $sessionStorageFailures = @($sessionStorageRuns | Where-Object { $_.exitCode -ne 0 })
          if ($contractExit -ne 0 -or $diagnosticFailures.Count -ne 0 -or $audioHostFailures.Count -ne 0 -or $sessionStorageFailures.Count -ne 0) {
            throw "Native contracts failed: full=$contractExit; additional FLAC failures=$($diagnosticFailures.Count); additional audio-host failures=$($audioHostFailures.Count); additional session-storage failures=$($sessionStorageFailures.Count)"
          }

      - name: Verify standalone USB carrier ownership
        if: ${{ !cancelled() && steps.native-client.outcome == 'success' }}
        shell: pwsh
        run: .\Scripts\verify-apple-usb-carrier.ps1

      - name: Decode Windows LAN QR images with the Android decoder
        id: lan-qr
        if: ${{ !cancelled() && steps.product-contracts.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project windows/Skybridge.WinClient.ContractTests/Skybridge.WinClient.ContractTests.csproj --configuration Debug --no-build --no-restore -- --export-lan-qr artifacts/lan-qr-images
          if ($LASTEXITCODE -ne 0) { throw 'Native QR image export failed.' }
          .\Scripts\verify-windows-lan-qr-images.ps1 -ImageDir artifacts/lan-qr-images -EvidenceDir artifacts/lan-qr-decode

      - name: Preserve native client for device qualification
        if: ${{ !cancelled() && inputs.package_native_client && steps.native-client.outcome == 'success' && steps.product-contracts.outcome == 'success' && steps.lan-qr.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-native-client-${{ github.sha }}
          path: |
            windows/Skybridge.WinClient/bin/Debug/net10.0-windows10.0.22621.0/win-x64/**
            artifacts/native-client-build.json
          if-no-files-found: error
          retention-days: 3

      - name: Verify interactive WinUI launch and controls
        if: ${{ !cancelled() && inputs.run_ui_smoke && steps.native-client.outcome == 'success' }}
        shell: pwsh
        run: |
          .\Scripts\test-windows-ui-geometry.ps1
          .\Scripts\test-windows-ui-consent-policy.ps1
          $assembly = 'windows/Skybridge.WinClient/bin/Debug/net10.0-windows10.0.22621.0/win-x64/Skybridge.WinClient.dll'
          $hash = (Get-FileHash -LiteralPath $assembly -Algorithm SHA256).Hash
          .\Scripts\invoke-windows-ui-smoke-ci.ps1 -Configuration Debug -EvidenceDir artifacts/winui-smoke -ExistingAssemblySha256 $hash -RequireUsbDiscoveryFixture

      - name: Run Windows portability gate
        if: ${{ !cancelled() && steps.rust-tooling.outcome == 'success' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          .\Scripts\verify-windows-portability-smoke.ps1 -CiMode -CheckOnlineStackFreshness -IncludeRustCliCoverage -StackFreshnessEvidencePath artifacts\windows-stack-freshness.json -RustCliCoverageEvidencePath artifacts\rust-cli-coverage.json -AcceptanceEvidencePath artifacts\windows-portability-acceptance.json
          .\Scripts\verify-windows-portability-acceptance-evidence.ps1 -AcceptanceEvidencePath artifacts\windows-portability-acceptance.json -StackFreshnessEvidencePath artifacts\windows-stack-freshness.json -RustCliCoverageEvidencePath artifacts\rust-cli-coverage.json -RequireRustCliCoverage -RequireOnlineStackFreshness

      - name: Collect native compiler configuration
        if: always()
        shell: pwsh
        run: |
          $nativeBuild = 'windows/Skybridge.WinClient/obj/skybridge-flac/x64'
          if (Test-Path -LiteralPath $nativeBuild -PathType Container) {
            New-Item -ItemType Directory -Force -Path artifacts | Out-Null
            Get-ChildItem -LiteralPath $nativeBuild -Recurse -File -Filter '*.vcxproj' |
              Where-Object { $_.BaseName -in @('FLAC', 'skybridge_flac', 'test_libFLAC') } |
              ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path artifacts $_.Name) }
          }

      - name: Preserve Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-validation-${{ github.sha }}
          path: |
            artifacts/*.log
            artifacts/*.json
            artifacts/*.vcxproj
            artifacts/apple-usb-carrier/*.json
            artifacts/apple-usb-carrier/*.log
            artifacts/lan-qr-images/*
            artifacts/lan-qr-decode/*.log
            artifacts/lan-qr-decode/*.json
            artifacts/winui-smoke/**
          if-no-files-found: error
          retention-days: 14
