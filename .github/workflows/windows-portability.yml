name: Windows TCP timeout diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tcp-timeout:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Prepare pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain setup failed.' }
      - name: Build actual product contract executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $project = 'windows/Skybridge.WinClient.ContractTests/Skybridge.WinClient.ContractTests.csproj'
          dotnet restore $project 2>&1 | Tee-Object artifacts/tcp-contracts-restore.log
          if ($LASTEXITCODE -ne 0) { throw 'Contract restore failed.' }
          dotnet build $project --configuration Debug --no-restore /p:TreatWarningsAsErrors=true 2>&1 | Tee-Object artifacts/tcp-contracts-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Contract build failed.' }
      - name: Verify TCP transport contracts three times
        shell: pwsh
        run: |
          $results = @()
          $project = 'windows/Skybridge.WinClient.ContractTests/Skybridge.WinClient.ContractTests.csproj'
          foreach ($attempt in 1..3) {
            dotnet run --project $project --configuration Debug --no-build --no-restore -- --tcp-transport 2>&1 | Tee-Object "artifacts/tcp-timeout-$attempt.log"
            $results += @{ attempt = $attempt; exitCode = $LASTEXITCODE }
          }
          $results | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/tcp-timeout-results.json
          if ($results.Where({ $_.exitCode -ne 0 }).Count -gt 0) { throw 'A TCP transport contract failed; inspect the captured cause and phase.' }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-tcp-timeout-${{ github.sha }}
          path: |
            artifacts/tcp-*.log
            artifacts/tcp-*.json
          if-no-files-found: error
          retention-days: 14
